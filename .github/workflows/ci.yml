name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RAG_LAB_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Evaluate quality gate
        run: |
          python eval/run_eval.py \
            --name ci \
            --database data/ci.db \
            --output "eval/results/ci-${{ matrix.python-version }}.json" \
            --fail-under-pass-rate 0.80 \
            --fail-under-hit-rate 0.85 \
            --require-quality-gate

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-quality-report-${{ matrix.python-version }}
          path: eval/results/ci-${{ matrix.python-version }}.json
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency and code security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"

      - name: Vulnerability scan
        run: python -m pip_audit --format columns

      - name: License inventory and copyleft guard
        run: |
          mkdir -p docs/audit
          pip-licenses --format=markdown --with-urls --output-file docs/audit/license-report-ci.md
          pip-licenses --fail-on "GPL;AGPL;LGPL" --partial-match

      - name: Static application security test
        run: bandit -r app -ll

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: docs/audit/license-report-ci.md
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t enterprise-rag-quality-lab:ci .

      - name: Start container
        run: |
          docker run -d --rm --name rag-lab-ci -p 18000:8000 \
            -e RAG_LAB_ENVIRONMENT=test \
            enterprise-rag-quality-lab:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs rag-lab-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop rag-lab-ci || true
