name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RAG_LAB_ENVIRONMENT: test
      CACHE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Evaluate quality gate
        run: |
          uv run python eval/run_eval.py \
            --no-cache \
            --name ci \
            --database data/ci.db \
            --output eval/results/ci.json \
            --baseline eval/results/baseline.json \
            --max-regression 0.02 \
            --fail-under-pass-rate 0.80 \
            --fail-under-hit-rate 0.85 \
            --require-quality-gate

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-quality-report
          path: eval/results/ci.json
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency and code security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install security tooling
        run: uv sync --frozen --extra security

      - name: Vulnerability scan
        run: uv run pip-audit --format columns

      - name: License inventory and copyleft guard
        run: |
          mkdir -p docs/audit
          uv run pip-licenses --format=markdown --with-urls --output-file docs/audit/license-report-ci.md
          uv run pip-licenses --fail-on "GPL;AGPL;LGPL" --partial-match

      - name: Static application security test
        run: uv run bandit -r app -ll

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: docs/audit/license-report-ci.md
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t enterprise-rag-quality-lab:ci .

      - name: Start container
        run: |
          docker run -d --rm --name rag-lab-ci -p 18000:8000 \
            -e RAG_LAB_ENVIRONMENT=test \
            enterprise-rag-quality-lab:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs rag-lab-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop rag-lab-ci || true
