name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RAG_LAB_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Evaluate quality gate
        run: |
          python eval/run_eval.py \
            --name ci \
            --database data/ci.db \
            --output "eval/results/ci-${{ matrix.python-version }}.json" \
            --fail-under-pass-rate 0.80 \
            --fail-under-hit-rate 0.85 \
            --require-quality-gate

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-quality-report-${{ matrix.python-version }}
          path: eval/results/ci-${{ matrix.python-version }}.json
          if-no-files-found: ignore
          retention-days: 14
