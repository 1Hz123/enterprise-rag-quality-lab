[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-quality-lab"
version = "1.3.2"
description = "A reproducible, offline-first quality lab for enterprise RAG systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enterprise RAG Quality Lab contributors" }]
keywords = ["rag", "retrieval", "evaluation", "fastapi", "enterprise"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Indexing",
]
# Runtime dependencies: everything required to run the API in production.
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pypdf>=7.1.1,<8.0",
  "python-multipart>=0.0.9,<1.0",
  "redis[hiredis]>=8.1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

# Optional groups: keep test, lint and audit tooling out of the runtime image.
[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3.0",
  "httpx>=0.27,<1.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]
security = [
  "bandit>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
  "pip-licenses>=4.3,<6.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[project.scripts]
enterprise-rag-lab = "app.main:run"

[project.urls]
Homepage = "https://example.com/enterprise-rag-quality-lab"
Issues = "https://example.com/enterprise-rag-quality-lab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"eval/run_eval.py" = ["E402"]
"scripts/ingest.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "eval", "scripts"]
